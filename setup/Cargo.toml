# J.A.I.'s setup: one file that carries J.A.I.'s installer (see src/main.rs). A crate of its own,
# as it holds the built J.A.I. inside it: the release workflow builds `jai` first, then this with
# JAI_SETUP_PAYLOAD naming the folder of what goes in.
[package]
name = "jai-setup"
version = "3.2.1"
edition = "2021"
publish = false

# (Its own workspace: never part of J.A.I.'s crate above it.)
[workspace]

[dependencies]
miniz_oxide = "0.8"

[build-dependencies]
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# The build script deflates about 100 MB: unoptimised it takes minutes.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
