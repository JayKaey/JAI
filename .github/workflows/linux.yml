# J.A.I. for Linux: builds the program on Ubuntu and runs the tests of what is Linux's own.
# The built program is kept as this run's artifact (`jai-linux-x86_64`), never released.
name: Linux

on:
  push:
    branches: [main, v3.2-tested-features]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The project's rule, on Linux too: no warnings (cargo caps the dependencies' own).
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - name: Libraries the build links against
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Tests of the Linux parts
        shell: bash
        run: |
          cargo test --release -- installer::tests::a_linux_pc kit_pc:: screen_context:: workbench:: fleet:: --test-threads=4 | tee tests.txt
          # (A notice: shown on the run's page and by the API without signing in, unlike the log.)
          echo "::notice title=Linux tests::$(grep '^test result' tests.txt)"
      - uses: actions/upload-artifact@v7
        with:
          name: jai-linux-x86_64
          path: target/release/jai
          retention-days: 30
