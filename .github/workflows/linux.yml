# J.A.I. for Linux: builds the program on Ubuntu and runs the tests of what is Linux's own; on
# Arch, checks the KDE parts against a real KWin without a screen.
# The built program is kept as this run's artifact (`jai-linux-x86_64`), never released.
name: Linux

on:
  push:
    branches: [main, v3.2-tested-features]
  workflow_dispatch:

env:
  # whisper-rs-sys's own Linux bindings, as the README builds: bindgen 0.69 with Arch's newer
  # libclang makes `whisper_full_params` without its fields.
  WHISPER_DONT_GENERATE_BINDINGS: "1"
  # Each failed test as one error (`awk "$FAILURES" tests.txt`): errors and notices are shown on the
  # run's page and by the API without signing in, unlike the log.
  FAILURES: |
    /^error(\[|:)|: error: / { print "::error::" $0 }
    /^---- .* stdout ----$/ { if (m) print "::error::" m; m = $0; next }
    m && (/^note: run with/ || /^failures:$/) { print "::error::" m; m = ""; next }
    m && NF { m = m "%0A" $0 }
    END { if (m) print "::error::" m }

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The project's rule, on Linux too: no warnings (cargo caps the dependencies' own).
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - name: Libraries the build links against
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Tests of the Linux parts
        shell: bash
        run: |
          code=0
          cargo test --release -- installer::tests::a_linux_pc kit_pc:: screen_context:: workbench:: fleet:: changes:: \
            kde:: plasma:: tray:: x11:: window_tiler:: camera_feed:: features::tests::xdg_ apps::tests::desktop_exec \
            media::tests::mpris_ audio_mixer::tests::pactl_ instant_replay::tests::a_screenshot kit_games::tests::video_memory \
            file_ops::tests::file_uri network_radar::tests::linux_ network_guardian::tests::linux_ vault::tests::the_key_file \
            --test-threads=4 2>&1 | tee tests.txt || code=$?
          echo "::notice title=Linux tests::$(grep '^test result' tests.txt)"
          awk "$FAILURES" tests.txt
          exit $code
      # Every other test too, on Linux: told as warnings, not yet required (some read a Windows PC).
      - name: The whole suite
        shell: bash
        continue-on-error: true
        timeout-minutes: 30
        run: |
          code=0
          cargo test --release -- --test-threads=4 2>&1 | tee all.txt || code=$?
          echo "::notice title=Whole suite on Linux::$(grep '^test result' all.txt)"
          awk "$FAILURES" all.txt | sed 's/^::error::/::warning::/'
          # (A step shows ten warnings at most: every failed test's name in one notice.)
          failed="$(grep -E '^    [a-z0-9_]+(::[a-z0-9_]+)+$' all.txt | tr -d ' ' | tr '\n' ' ')" || true
          [ -z "$failed" ] || echo "::notice title=Failed on Linux::$failed"
          exit $code
      - uses: actions/upload-artifact@v7
        with:
          name: jai-linux-x86_64
          path: target/release/jai
          retention-days: 30

  kwin:
    # KDE Plasma as on Sir's Arch PC: `live_checks::kde` against KWin. xterm stands in for his
    # programs (foot, a Wayland terminal, never drew a new size here, so KWin never applied it);
    # without a GPU KWin draws with QPainter, so screenshots (OpenGL) are not checked.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: archlinux:latest
      # (Arch lets kwin_wayland raise its priority; a container without that right cannot start it.)
      options: --cap-add=SYS_NICE
    env:
      RUSTFLAGS: "-D warnings"
      JAI_REAL_PLASMA: "1"
    steps:
      - name: The README's packages, KWin, XWayland and a terminal
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm --needed base-devel rust cmake clang alsa-lib opus git dbus kwin xorg-xwayland xterm
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # (A cache of its own: the first one kept whisper's broken generated bindings, and its
          # build script does not run again when WHISPER_DONT_GENERATE_BINDINGS changes.)
          key: bundled-bindings
      - name: Build the tests
        shell: bash
        run: cargo test --release --no-run 2>&1 | tee build.txt || { awk "$FAILURES" build.txt; exit 1; }
      # KWin reads the menu entry as a program connects: it is written before KWin starts.
      - name: The menu entry KWin goes by
        run: cargo test --release -- --ignored --exact live_checks::kde::menu_entry_names_this_program
      - name: The KDE parts against KWin
        shell: bash
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime XDG_CURRENT_DESKTOP=KDE KWIN_COMPOSE=Q QT_LOGGING_RULES=KWIN_UTILS.debug=true
          mkdir -p -m 700 "$XDG_RUNTIME_DIR" && mkdir -p -m 1777 /tmp/.X11-unix
          # (The checks' output and result go to files: KWin's exit code need not be theirs.)
          timeout 600 dbus-run-session -- kwin_wayland --virtual --xwayland --no-lockscreen --width 1280 --height 800 --output-count 2 \
            --exit-with-session "bash -c 'cargo test --release -- --ignored --test-threads=1 live_checks::kde::kwin_ > kwin.txt 2>&1; echo \$? > kwin.code'" \
            > kwin.log 2>&1 || true
          cat kwin.log kwin.txt || true
          # (KWin's lookup of the menu entry and its last words, then the checks.)
          echo "::notice title=KWin::$({ grep KWIN_UTILS kwin.log; tail -n 15 kwin.log; } | head -c 4000 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          echo "::notice title=KWin checks::$(grep '^test result' kwin.txt)"
          awk "$FAILURES" kwin.txt
          exit "$(cat kwin.code)"
