# J.A.I.'s setups: pushing a tag `v…` builds JAI-setup.exe (Windows) and JAI-setup-linux, one file
# each for a new PC or an update (setup/: J.A.I.'s installer inside), checks both, and publishes
# them as that version's release (an older release or draft of the same tag is replaced). A tag is
# pushed only when Sir asks for a release. A change to this file or to setup/ on main builds and
# checks both without a release; so does "Run workflow" on the Actions page.
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'setup/**']
  workflow_dispatch:

env:
  # whisper.cpp for any PC, not the runner's CPU: AVX2, FMA and F16C, never AVX-512 (ggml's
  # defaults once "native" is off).
  GGML_NATIVE: "OFF"
  # A failed build as errors anyone can read (the log needs a sign-in): its error lines, then its end.
  FAILED: |
    awk '/^error(\[|:)|: error: / { print "::error::" $0 }' build.txt
    echo "::error title=Build::$(tail -c 3500 build.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
    exit 1
  # A failed check the same way.
  CHECK_FAILED: |
    echo "::error title=Check::$(tail -c 3000 check.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
    exit 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # bindgen's libclang (whisper.cpp's bindings), from the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Whisper's graphics-card path is built against Vulkan (whisper.cpp's shaders need glslc);
      # its installer also puts the Vulkan loader (vulkan-1.dll) into System32.
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.363.1'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          Start-Process .\vulkan-sdk.exe -ArgumentList '--root', "C:\VulkanSDK\$version", '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait
          if (-not (Test-Path "C:\VulkanSDK\$version\Bin\glslc.exe")) { throw 'The Vulkan SDK did not install' }
          "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$version\Bin" >> $env:GITHUB_PATH
          # Ninja (Visual Studio's own), because its file tracker fails on the long paths of
          # the Vulkan shader tool's build.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw "No Ninja in $vs" }
          $ninja >> $env:GITHUB_PATH
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
      - name: Build
        shell: bash
        run: cargo build --release 2>&1 | tee build.txt || eval "$FAILED"
      # JAI.exe starts with DirectML, the Visual C++ runtime and the Vulkan loader beside it (as
      # build.bat packs them): all of it goes into the setup. So does eSpeak NG (Kokoro's phonemes), from its own
      # GitHub release: the files of its MSI as espeak-ng.zip, which the installer unpacks.
      - name: What goes into the setup
        shell: pwsh
        run: |
          $crt = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          $dml = Get-ChildItem target\release, "$env:LOCALAPPDATA\ort.pyke.io" -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          New-Item -ItemType Directory payload | Out-Null
          Copy-Item target\release\jai.exe payload\JAI.exe
          Copy-Item $dml.FullName payload\
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') { Copy-Item (Join-Path $crt.FullName $dll) payload\ }
          Copy-Item "$env:SystemRoot\System32\vulkan-1.dll" payload\
          Invoke-WebRequest https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi -OutFile espeak-ng.msi
          Start-Process msiexec.exe -ArgumentList '/a', "`"$PWD\espeak-ng.msi`"", '/qn', "TARGETDIR=`"$PWD\espeak`"" -Wait
          $espeak = (Get-ChildItem espeak -Recurse -Filter libespeak-ng.dll | Select-Object -First 1).DirectoryName
          if (-not $espeak -or -not (Test-Path (Join-Path $espeak 'espeak-ng-data'))) { throw 'eSpeak NG did not unpack from its MSI' }
          & "$env:SystemRoot\System32\tar.exe" -a -cf payload\espeak-ng.zip -C $espeak .
          Get-ChildItem payload | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }
      - name: The setup
        shell: bash
        working-directory: setup
        run: |
          cargo test --release 2>&1 | tee build.txt || eval "$FAILED"
          JAI_SETUP_PAYLOAD="$GITHUB_WORKSPACE/payload" cargo build --release 2>&1 | tee build.txt || eval "$FAILED"
      # It starts on a PC without the Visual C++ runtime (built in), unpacks J.A.I. and he starts.
      - name: Check
        shell: bash
        run: |
          if grep -q -i -a vcruntime140 setup/target/release/jai-setup.exe; then echo "::error::The setup needs the Visual C++ runtime"; exit 1; fi
          setup/target/release/jai-setup.exe --check > check.txt 2>&1 || eval "$CHECK_FAILED"
          head -n 3 check.txt
          cp setup/target/release/jai-setup.exe JAI-setup.exe
          # (J.A.I. alone too: another PC of Sir's takes a newer release from it by itself, `fleet::update`.)
          cp target/release/jai.exe JAI.exe
          ls -l JAI-setup.exe JAI.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            JAI-setup.exe
            JAI.exe

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Libraries the build links against
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: cargo build --release 2>&1 | tee build.txt || eval "$FAILED"
      - name: The setup
        shell: bash
        working-directory: setup
        run: |
          echo "The libraries jai starts with:"; readelf -d ../target/release/jai | grep NEEDED
          cargo test --release 2>&1 | tee build.txt || eval "$FAILED"
          mkdir -p ../payload && cp ../target/release/jai ../payload/jai
          JAI_SETUP_PAYLOAD="$GITHUB_WORKSPACE/payload" cargo build --release 2>&1 | tee build.txt || eval "$FAILED"
          cp target/release/jai-setup ../JAI-setup-linux
          cp ../target/release/jai ../jai-linux
          ls -l ../JAI-setup-linux ../jai-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            JAI-setup-linux
            jai-linux

  # The Linux setup on a bare Arch: it installs the packages J.A.I. needs, and the jai it carries
  # starts there.
  linux-check:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: An up-to-date Arch
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm
      - uses: actions/download-artifact@v8
        with:
          name: linux
      - name: Check
        shell: bash
        run: |
          chmod +x JAI-setup-linux
          ./JAI-setup-linux --check > check.txt 2>&1 || eval "$CHECK_FAILED"
          head -n 3 check.txt
          pacman -Q alsa-lib opus espeak-ng tesseract-data-deu discover ffmpeg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The release
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir out
          cat > notes.md <<'EOF'
          J.A.I., the local voice assistant: one file for Windows and one for Linux, for a new PC or an update.

          - **Windows:** start `JAI-setup.exe`. It is not signed, so Windows warns the first time: *More info* → *Run anyway*.
          - **Linux** (made for KDE Plasma 6 on Arch): `chmod +x JAI-setup-linux`, then start it. It installs the packages J.A.I. needs with pacman and asks for your password for that. Linux has not yet been run on a real PC.

          The setup installs J.A.I. on a PC beside the one he already runs on (the main PC): it asks for the main PC's address and an account there, and downloads nothing from that PC. J.A.I. comes in this file, his engine from Ollama's release on GitHub, then the voice, the ears and the brain that fits the graphics card (4 GB of graphics memory at least). Where J.A.I. is installed already, the same file updates him: he quits, this version comes in, and he starts again (a PC that runs another version than the main PC then takes the main PC's).

          `JAI.exe` and `jai-linux` are J.A.I. alone, for his own updates: J.A.I. on another PC with a valid account takes a newer release by itself, even while the main PC is off.
          EOF
          # What changed: the annotated tag's own message (`git tag -a v… -m "…"`), above the rest.
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          if [ "${tag%% *}" = tag ]; then
            { printf '## What changed\n\n'; gh api "repos/$GITHUB_REPOSITORY/git/tags/${tag#* }" --jq .message; printf '\n'; cat notes.md; } > notes.tmp && mv notes.tmp notes.md
          fi
          # (An older release or draft of this tag gives way; the list shows drafts too.)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" out/windows/JAI-setup.exe out/linux/JAI-setup-linux out/windows/JAI.exe out/linux/jai-linux \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "J.A.I. $GITHUB_REF_NAME" --notes-file notes.md
