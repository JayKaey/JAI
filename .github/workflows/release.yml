# J.A.I.'s installers: pushing a tag `v…` builds the Windows installer (JAI-setup.exe with the
# DLLs it starts with, zipped) and the Linux one (jai-linux-x86_64) and puts both into a draft
# release, which Sir looks at and publishes himself. A change to this file builds both without a
# release, as a test; so does "Run workflow" on the Actions page.
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

env:
  # A failed build as errors anyone can read (the log needs a sign-in): its error lines, then its end.
  FAILED: |
    awk '/^error(\[|:)|: error: / { print "::error::" $0 }' build.txt
    echo "::error title=Build::$(tail -c 3500 build.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
    exit 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # bindgen's libclang (whisper.cpp's bindings), from the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: cargo build --release 2>&1 | tee build.txt || eval "$FAILED"
      # JAI.exe starts with DirectML and the Visual C++ runtime beside it (as build.bat packs
      # them); started on its own it is the installer.
      - name: Pack
        shell: pwsh
        run: |
          $crt = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          $dml = Get-ChildItem target\release, "$env:LOCALAPPDATA\ort.pyke.io" -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          New-Item -ItemType Directory JAI | Out-Null
          Copy-Item target\release\jai.exe JAI\JAI-setup.exe
          Copy-Item $dml.FullName JAI\
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') { Copy-Item (Join-Path $crt.FullName $dll) JAI\ }
          Compress-Archive JAI\* JAI-setup-windows.zip
          Get-ChildItem JAI | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: JAI-setup-windows.zip

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Libraries the build links against
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: cargo build --release 2>&1 | tee build.txt || eval "$FAILED"
      - run: cp target/release/jai jai-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: jai-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The draft release
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir out
          cat > notes.md <<'EOF'
          J.A.I., the local voice assistant, for Windows and Linux.

          - **Windows:** unzip `JAI-setup-windows.zip` and start `JAI-setup.exe`. The program is not signed, so Windows warns the first time: *More info* → *Run anyway*.
          - **Linux** (made for KDE Plasma 6 on Arch): `chmod +x jai-linux-x86_64` and start it. The packages it needs are in the README's [Linux section](https://github.com/JayKaey/JAI#linux). Linux has not yet been run on a real PC.

          The installer is not standalone: it asks for the address of the PC J.A.I. already runs on and an account there, takes what it needs from that PC, then downloads the voice, the ears and the brain that fits the graphics card (4 GB of graphics memory at least).
          EOF
          gh release create "$GITHUB_REF_NAME" out/windows/JAI-setup-windows.zip out/linux/jai-linux-x86_64 \
            --repo "$GITHUB_REPOSITORY" --draft --title "J.A.I. $GITHUB_REF_NAME" --notes-file notes.md
