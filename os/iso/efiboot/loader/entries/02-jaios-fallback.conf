title    Install J.A.I.OS (plain graphics: no NVIDIA driver, no mode setting)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% systemd.firstboot=off module_blacklist=pcspkr,nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm nomodeset
