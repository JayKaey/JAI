LABEL jaios
TEXT HELP
Start the J.A.I.OS install stick. J.A.I. installs J.A.I.OS from it.
ENDTEXT
MENU LABEL Install J.A.I.OS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% systemd.firstboot=off module_blacklist=pcspkr

LABEL jaiosfb
TEXT HELP
The same without the NVIDIA driver and without mode setting,
for a graphics card the first entry shows nothing on.
ENDTEXT
MENU LABEL Install J.A.I.OS (plain graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% systemd.firstboot=off module_blacklist=pcspkr,nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm nomodeset
