# The repositories the install stick is built from (mkarchiso; the stick's own pacman.conf is
# airootfs/etc/pacman.conf). The builder trusts CachyOS's key first (see the workflow).

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 10
DisableDownloadTimeout
# (A container has no room for pacman's download sandbox.)
DisableSandbox
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# J.A.I.OS's own packages, as the workflow has just built them (jai, jaios-settings, jaios).
[jaios]
SigLevel = Optional TrustAll
Server = file://%JAIOS_REPO%

# CachyOS's packages for every x86-64 PC (the installer picks the v3/v4 ones for the PC).
[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
