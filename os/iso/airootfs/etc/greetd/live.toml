# The install stick: no login. `liveuser` is in the J.A.I.OS session at once (KWin, J.A.I.'s
# shell), where the installer starts (/etc/xdg/autostart/jaios-installer.desktop).

[terminal]
vt = 1

[initial_session]
command = "env XDG_SESSION_TYPE=wayland /usr/lib/plasma-dbus-run-session-if-needed /usr/bin/startplasma-wayland"
user = "liveuser"

# After that session has ended: J.A.I.'s login screen inside KWin, as on the installed system
# (os/settings/etc/greetd/config.toml).
[default_session]
command = "dbus-run-session kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --xwayland --exit-with-session '/usr/lib/jai/jai --greeter'"
user = "greeter"
