# The install stick's pacman: what the installer installs J.A.I.OS from (online).

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ParallelDownloads = 10
DisableDownloadTimeout
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# shortcut: [jaios] is not signed (GitHub serves it over TLS from J.A.I.'s own repository);
# sign the packages and the database once J.A.I.OS has a key of its own.
[jaios]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/jaios-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
