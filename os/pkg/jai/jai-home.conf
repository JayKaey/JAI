# Each user's J.A.I. (systemd-tmpfiles --user, at every login): his data in ~/.local/share/jai,
# the models every user shares and the program's runtime linked into it. His user units run
# with this folder as their working directory.
d %h/.local/share/jai 0700 - - -
L %h/.local/share/jai/models - - - - /var/lib/jai/models
L %h/.local/share/jai/runtime - - - - /usr/lib/jai/runtime
