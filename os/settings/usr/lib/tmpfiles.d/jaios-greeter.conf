# J.A.I.OS: what the login screen (the user greeter) reads. The voice prints are written by the
# root core alone; models and runtime are the shared ones.
d /var/lib/jaios 0755 root root -
d /var/lib/jaios/voices 0750 root greeter -
d /var/lib/jaios/greeter 0750 greeter greeter -
L+ /var/lib/jaios/greeter/models - - - - /var/lib/jai/models
L+ /var/lib/jaios/greeter/runtime - - - - /usr/lib/jai/runtime
