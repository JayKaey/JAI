<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- J.A.I.OS: root owns the root core; root and the group jai may call it, no one else.
     (The core asks the bus for each caller's user and checks the group once more.) -->
<busconfig>
  <policy context="default">
    <deny send_destination="org.jaios.System1"/>
  </policy>
  <policy group="jai">
    <allow send_destination="org.jaios.System1"/>
  </policy>
  <policy user="root">
    <allow own="org.jaios.System1"/>
    <allow send_destination="org.jaios.System1"/>
  </policy>
</busconfig>
