# J.A.I.OS's initramfs: systemd's, with Plymouth (the theme `jaios`: his core draws itself)
# before the disks, so an encrypted disk's password is asked on his black.
# sd-encrypt unlocks a LUKS root named on the kernel line as rd.luks.name=<UUID>=root; without
# one it does nothing. btrfs needs no fsck hook.
# (Named 10-…: the install stick's own archiso.conf sorts after it and wins there.)
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole plymouth block sd-encrypt filesystems)
